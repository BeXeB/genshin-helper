<div class="game-link">
  <ng-content></ng-content>
  @if (title) {
    <div
      #tooltip
      class="tooltip"
      [class.top]="tooltipPosition === 'top'"
      [class.bottom]="tooltipPosition === 'bottom'"
      [style.border-color]="elementColor"
    >
      <strong>{{ title }}</strong>
      <app-ast-renderer
        [nodes]="descriptionNodes"
        [elementColor]="elementColor"
      >
      </app-ast-renderer>
    </div>
  }
</div>
